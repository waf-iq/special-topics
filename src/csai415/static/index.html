<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CSAI415 GraphRAG — Ask</title>
<style>
  :root {
    --bg:#0f1115; --card:#181b22; --line:#272b35; --fg:#e6e8ee; --muted:#9aa3b2;
    --accent:#6ea8fe; --accent2:#7ee0a6; --warn:#ffb86b; --chip:#222732;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; font-weight:650; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:12.5px; }
  .status { color:var(--muted); font-size:12.5px; margin:6px 0 18px; }
  .status b { color:var(--accent2); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  textarea { width:100%; min-height:64px; resize:vertical; background:#0d0f14; color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  .controls { display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  label.f { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px; }
  select, input[type=number] { background:#0d0f14; color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:6px 8px; font:inherit; }
  input[type=number] { width:64px; }
  button { margin-left:auto; background:var(--accent); color:#0a0c10; border:0; font-weight:650;
    padding:9px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  .examples { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .ex { background:var(--chip); border:1px solid var(--line); color:var(--muted); font-size:12px;
    padding:4px 9px; border-radius:20px; cursor:pointer; }
  .ex:hover { color:var(--fg); border-color:var(--accent); }
  #out { margin-top:20px; display:none; }
  .meta { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .chip { background:var(--chip); border:1px solid var(--line); border-radius:20px;
    padding:3px 10px; font-size:12px; color:var(--muted); }
  .chip b { color:var(--fg); font-weight:600; }
  .answer { font-size:16px; line-height:1.65; white-space:pre-wrap; }
  .answer sup { color:var(--accent); font-weight:700; }
  .cols { display:none; grid-template-columns:1fr 1fr; gap:12px; }
  .col { border:1px solid var(--line); border-radius:9px; padding:12px; background:#0d0f14; }
  .col h4 { margin:0 0 8px; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .col h4 .pid { color:var(--accent2); font-family:ui-monospace,Menlo,monospace; }
  .col h4 .lat { color:var(--muted); font-weight:500; }
  .col .answer { font-size:14.5px; }
  @media (max-width:680px){ .cols { grid-template-columns:1fr; } }
  button.alt { background:var(--accent2); margin-left:8px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    margin:22px 0 10px; }
  .cite { border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:9px; background:#0d0f14; }
  .cite .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .cite .n { color:var(--accent); font-weight:700; }
  .cite .pid { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; color:var(--accent2); }
  .cite .pg { color:var(--muted); font-size:12px; }
  .cite .ti { color:var(--fg); }
  .cite .ctx { color:var(--muted); font-size:12.5px; margin-top:6px; max-height:0; overflow:hidden;
    transition:max-height .2s; }
  .cite.open .ctx { max-height:240px; overflow:auto; }
  .cite .toggle { color:var(--accent); font-size:11.5px; cursor:pointer; margin-left:auto; }
  .steps { color:var(--muted); font-size:12px; font-family:ui-monospace,Menlo,monospace; margin-top:4px; }
  .err { color:var(--warn); }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CSAI415 <span>GraphRAG</span> — Ask</h1>
    <span class="sub">arXiv cs.CL · graph→retrieve→rerank→cite</span>
  </header>
  <div class="status" id="status">connecting…</div>

  <div class="card">
    <textarea id="q" placeholder="Ask a question about the arXiv cs.CL corpus…"></textarea>
    <div class="controls">
      <label class="f">mode
        <select id="mode">
          <option value="hybrid">hybrid</option>
          <option value="graph">graph</option>
          <option value="vector">vector</option>
        </select>
      </label>
      <label class="f">k <input type="number" id="k" value="4" min="1" max="10" /></label>
      <label class="f"><input type="checkbox" id="rerank" checked /> rerank</label>
      <button id="ask">Ask</button>
      <button id="compare" class="alt" title="Answer the same evidence with Qwen-3B and Groq-70B">Compare</button>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <div id="out" class="card">
    <div class="meta" id="meta"></div>
    <div class="answer" id="answer"></div>
    <div class="cols" id="cols"></div>
    <h3 id="citeHead">Citations</h3>
    <div id="cites"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const EXAMPLES = [
  "What is the goal of the CodeRL+ approach in code generation?",
  "What type of learning is used to improve small language models for code generation?",
  "How do agent harnesses reshape agentic search?",
];

async function loadStatus() {
  try {
    const r = await fetch("/healthz");
    const j = await r.json();
    $("#status").innerHTML = j.answerer
      ? `answerer: <b>${j.answerer}</b> · status: ${j.status}`
      : `status: ${j.status}`;
  } catch (e) { $("#status").innerHTML = `<span class="err">server unreachable</span>`; }
}

function renderExamples() {
  $("#examples").innerHTML = "";
  EXAMPLES.forEach(t => {
    const b = document.createElement("span");
    b.className = "ex"; b.textContent = t;
    b.onclick = () => { $("#q").value = t; $("#q").focus(); };
    $("#examples").appendChild(b);
  });
}

// render [n] as superscript links
function fmtAnswer(text) {
  return text.replace(/\[(\d+)\]/g, '<sup>[$1]</sup>');
}

function metaChips(j, latLabel, latVal) {
  const sub = j.steps.find(s => s.stage === "subgraph");
  return [
    `<span class="chip">mode <b>${j.mode}</b></span>`,
    `<span class="chip">rerank <b>${j.rerank}</b></span>`,
    `<span class="chip">${latLabel} <b>${latVal.toFixed(0)} ms</b></span>`,
    `<span class="chip">cites <b>${j.citations.length}</b></span>`,
    sub ? `<span class="chip">graph <b>${sub.method}</b> (${sub.n_papers} papers)</span>` : "",
  ].join("");
}

function renderCites(j) {
  $("#citeHead").style.display = j.citations.length ? "block" : "none";
  $("#cites").innerHTML = "";
  j.citations.forEach((c, i) => {
    const ctx = (j.contexts && j.contexts[i]) ? j.contexts[i] : "";
    const div = document.createElement("div");
    div.className = "cite";
    div.innerHTML =
      `<div class="top"><span class="n">[${i+1}]</span>` +
      `<span class="pid">${c.paper_id}</span>` +
      (c.page_range ? `<span class="pg">p${c.page_range}</span>` : "") +
      `<span class="ti">${c.title || ""}</span>` +
      (ctx ? `<span class="toggle">context ▾</span>` : "") +
      `</div>` + (ctx ? `<div class="ctx">${ctx.replace(/</g,"&lt;")}</div>` : "");
    const tg = div.querySelector(".toggle");
    if (tg) tg.onclick = () => div.classList.toggle("open");
    $("#cites").appendChild(div);
  });
}

function busy(on) {
  ["#ask", "#compare"].forEach(s => { $(s).disabled = on; });
  if (on) $("#ask").innerHTML = '<span class="spin"></span>'; else $("#ask").textContent = "Ask";
}

function prep(query) {
  if (!query) return false;
  busy(true);
  $("#out").style.display = "block";
  $("#meta").innerHTML = ""; $("#cites").innerHTML = ""; $("#cols").innerHTML = "";
  return true;
}

async function ask() {
  const query = $("#q").value.trim();
  if (!prep(query)) return;
  $("#cols").style.display = "none"; $("#answer").style.display = "block";
  $("#answer").innerHTML = '<span class="err">running pipeline…</span>';
  try {
    const r = await fetch("/ask", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ query, mode:$("#mode").value, k:+$("#k").value, rerank:$("#rerank").checked })
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    $("#meta").innerHTML = metaChips(j, "latency", j.latency_ms);
    $("#answer").innerHTML = fmtAnswer(j.answer) +
      `<div class="steps">pipeline: ${j.steps.map(s => s.stage).join(" → ")}</div>`;
    renderCites(j);
  } catch (e) {
    $("#answer").innerHTML = `<span class="err">Error: ${e.message}</span>`;
  } finally { busy(false); }
}

async function compare() {
  const query = $("#q").value.trim();
  if (!prep(query)) return;
  $("#answer").style.display = "none"; $("#cols").style.display = "grid";
  $("#cols").innerHTML = '<div class="col"><span class="err">running both answerers…</span></div>';
  try {
    const r = await fetch("/compare", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ query, mode:$("#mode").value, k:+$("#k").value, rerank:$("#rerank").checked })
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    $("#meta").innerHTML = metaChips(j, "retrieve", j.retrieve_latency_ms);
    $("#cols").innerHTML = "";
    j.results.forEach(res => {
      const col = document.createElement("div");
      col.className = "col";
      col.innerHTML =
        `<h4><span class="pid">${res.answerer}</span><span class="lat">${res.gen_latency_ms.toFixed(0)} ms</span></h4>` +
        (res.error ? `<span class="err">${res.error}</span>`
                   : `<div class="answer">${fmtAnswer(res.answer)}</div>`);
      $("#cols").appendChild(col);
    });
    renderCites(j);
  } catch (e) {
    $("#cols").innerHTML = `<div class="col"><span class="err">Error: ${e.message}</span></div>`;
  } finally { busy(false); }
}

$("#ask").onclick = ask;
$("#compare").onclick = compare;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey||e.ctrlKey)) ask(); });
renderExamples();
loadStatus();
</script>
</body>
</html>
